<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Retro Handheld Console Body -->
  <rect x="5" y="2" width="22" height="28" rx="3" fill="#FFF0F5" stroke="#3A1F2D" stroke-width="2" />
  
  <!-- Screen Bezel -->
  <rect x="8" y="5" width="16" height="12" rx="1.5" fill="#3A1F2D" />
  <!-- Screen LCD -->
  <rect x="9" y="6" width="14" height="10" rx="1" fill="#FFE3EC" />
  
  <!-- Glowing Pixel Heart on LCD -->
  <!-- Top lobe left -->
  <rect x="11" y="8" width="2" height="2" fill="#FF4370" />
  <!-- Top lobe right -->
  <rect x="15" y="8" width="2" height="2" fill="#FF4370" />
  <!-- Middle span -->
  <rect x="10" y="9" width="8" height="2" fill="#FF4370" />
  <!-- Specular shine -->
  <rect x="11" y="9" width="1" height="1" fill="#FFFFFF" />
  <!-- Lower tapering -->
  <rect x="11" y="11" width="6" height="2" fill="#FF4370" />
  <!-- Bottom tip -->
  <rect x="13" y="13" width="2" height="1" fill="#FF4370" />
  
  <!-- D-Pad -->
  <rect x="9" y="21" width="6" height="2" fill="#3A1F2D" />
  <rect x="11" y="19" width="2" height="6" fill="#3A1F2D" />
  <rect x="11" y="21" width="2" height="2" fill="#5C4314" />
  
  <!-- Action Buttons A & B -->
  <circle cx="21" cy="23" r="1.5" fill="#FF4370" stroke="#3A1F2D" stroke-width="0.8" />
  <circle cx="24" cy="20" r="1.5" fill="#C9184A" stroke="#3A1F2D" stroke-width="0.8" />
  
  <!-- Speaker vents -->
  <line x1="20" y1="27" x2="24" y2="25" stroke="#3A1F2D" stroke-width="1" stroke-linecap="round" />
  <line x1="22" y1="28" x2="25" y2="26.5" stroke="#3A1F2D" stroke-width="1" stroke-linecap="round" />
</svg>
